version: "3.9"

services:
  # ============================================================
  #  SERVICE MARIADB (Base de données principale)
  # ============================================================
  db:
    container_name: mariadb_container
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql   # Volume persistant pour les données
    networks:
      - backend

  # ============================================================
  #   ADMINER (Interface web simple)
  # ============================================================
  adminer:
    container_name: adminer_container
    image: adminer:4.8.1
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   PHPMYADMIN (Interface web avancée)
  # ============================================================
  phpmyadmin:
    container_name: phpmyadmin_container
    image: phpmyadmin:5.2.3-apache
    restart: always
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   SMTP4DEV (Serveur mail pour tests)
  # ============================================================
  smtp4dev:
    container_name: smtp4dev_container
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "${SMTP4DEV_HTTP_PORT}:80"
      - "${SMTP4DEV_SMTP_PORT}:25"
      - "${SMTP4DEV_IMAP_PORT}:143"
      - "${SMTP4DEV_POP3_PORT}:110"
    volumes:
      - smtp4dev-data:/smtp4dev   # Volume persistant pour les mails
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=${SMTP4DEV_HOSTNAME}
      - ServerOptions__LockSettings=true
      - ServerOptions__Mailboxes__0=Test=${SMTP4DEV_MAILBOX}
      - ServerOptions__Database=${SMTP4DEV_DB}
      - ServerOptions__NumberOfMessagesToKeep=${SMTP4DEV_MESSAGES_KEEP}
      - ServerOptions__NumberOfSessionsToKeep=${SMTP4DEV_SESSIONS_KEEP}
      - ServerOptions__DisableIPv6=true
      - ServerOptions__TlsMode=None
    networks:
      - backend

  # ============================================================
  #   BACKEND SPRING BOOT (Application principale)
  # ============================================================
  backend:
    container_name: springboot_container
    build:
      context: src/main/java                # Racine du projet (où se trouve le Dockerfile)
      dockerfile: Dockerfile    # Dockerfile qui copie et compile le code source
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"   # Expose le port configuré (ex: 9191)
    volumes:
      - ./src:/app/src          # Monte le code source local pour développement
      - ./pom.xml:/app/pom.xml  # Monte le pom.xml pour rebuild rapide
    depends_on:
      - db                      # Démarre après la base de données
    networks:
      - backend

# ============================================================
#   VOLUMES PERSISTANTS
# ============================================================
volumes:
  db_data:
  smtp4dev-data:

# ============================================================
#   RÉSEAU INTERNE UNIQUE
# ============================================================
networks:
  backend:
