services:
  # ============================================================
  #  SERVICE MARIADB (Base de données principale)
  # ============================================================
  db:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  # ============================================================
  #   ADMINER (Interface web simple)
  # ============================================================
  adminer:
    image: adminer:4.8.1
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   PHPMYADMIN (Interface web avancée)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   SMTP4DEV (Serveur mail pour tests)
  # ============================================================
  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "${SMTP4DEV_HTTP_PORT}:80"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=${SMTP4DEV_HOSTNAME}
      - ServerOptions__LockSettings=true
      - ServerOptions__Mailboxes__0=Test=${SMTP4DEV_MAILBOX}
      - ServerOptions__Database=${SMTP4DEV_DB}
      - ServerOptions__NumberOfMessagesToKeep=${SMTP4DEV_MESSAGES_KEEP}
      - ServerOptions__NumberOfSessionsToKeep=${SMTP4DEV_SESSIONS_KEEP}
      - ServerOptions__DisableIPv6=true
      - ServerOptions__TlsMode=None
    networks:
      - backend

  # ============================================================
  #   BACKEND SPRING BOOT (Application principale)
  # ============================================================
  backend:
    build:
      context: .                # Racine du projet (où se trouve le Dockerfile)
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - db
    networks:
      - backend

# ============================================================
#   VOLUMES PERSISTANTS
# ============================================================
volumes:
  db_data:
  smtp4dev-data:

# ============================================================
#   RÉSEAU INTERNE UNIQUE
# ============================================================
networks:
  backend:
