version: "3.8"  # Version de la syntaxe Docker Compose

services:
  # ============================================================
  #  SERVICE MARIADB (Base de données principale)
  # ============================================================
  db:
    container_name: mariadb_container
    image: mariadb:11.4   # Version LTS stable de MariaDB
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example          # Mot de passe root
      MARIADB_DATABASE: useradvicesmariadb    # Base créée automatiquement
      MARIADB_USER: app_user                  # Utilisateur de l'application
      MARIADB_PASSWORD: app_pass              # Mot de passe associé
    ports:
      - "3308:3306"                           # Accès depuis l'hôte → port 3308
    volumes:
      - db_data:/var/lib/mysql                # Données persistantes
    networks:
      - backend                                # Réseau interne

  # ============================================================
  #   ADMINER (Interface web simple)
  # ============================================================
  adminer:
    container_name: adminer_container
    image: adminer:4.8.1                      # Version stable
    restart: always
    ports:
      - "9080:8080"                           # UI : http://localhost:9080
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   PHPMYADMIN (Interface web avancée)
  # ============================================================
  phpmyadmin:
    container_name: phpmyadmin_container
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: db                            # Adresse de MariaDB
      PMA_PORT: 3306
    ports:
      - "9090:80"                             # UI : http://localhost:9090
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   SMTP4DEV (Serveur mail pour tests)
  # ============================================================
  smtp4dev:
    container_name: smtp4dev_container
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - "5001:80"                             # Interface web
      - "2526:25"                             # SMTP port
      - "1153:143"                            # IMAP
      - "1120:110"                            # POP3
    volumes:
      - smtp4dev-data:/smtp4dev               # Emails stockés
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__LockSettings=true
      - ServerOptions__Mailboxes__0=Test=hello@world.com
      - ServerOptions__Database=database.db
      - ServerOptions__NumberOfMessagesToKeep=100
      - ServerOptions__NumberOfSessionsToKeep=50
      - ServerOptions__DisableIPv6=true
      - ServerOptions__TlsMode=None
    networks:
      - backend

# ============================================================
#   VOLUMES PERSISTANTS
# ============================================================
volumes:
  db_data:
  smtp4dev-data:

# ============================================================
#   RÉSEAU INTERNE UNIQUE
# ============================================================
networks:
  backend:
