# Docker Compose moderne : plus besoin de "version"
# La syntaxe est implicite avec Docker Compose v2+

services:
  # ============================================================
  #  SERVICE MARIADB (Base de données principale)
  # ============================================================
  db:
    container_name: mariadb_container
    image: mariadb:11.8   # Dernière LTS stable (maintenue jusqu’en 2029)
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: useradvicesmariadb
      MARIADB_USER: app_user
      MARIADB_PASSWORD: app_pass
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  # ============================================================
  #   ADMINER (Interface web simple)
  # ============================================================
  adminer:
    container_name: adminer_container
    image: adminer:4.8.1   # Version stable
    restart: always
    ports:
      - "9080:8080"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   PHPMYADMIN (Interface web avancée)
  # ============================================================
  phpmyadmin:
    container_name: phpmyadmin_container
    image: phpmyadmin:5.2.3-apache   # Dernière version stable
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "9090:80"
    depends_on:
      - db
    networks:
      - backend

  # ============================================================
  #   SMTP4DEV (Serveur mail pour tests)
  # ============================================================
  smtp4dev:
    container_name: smtp4dev_container
    image: rnwood/smtp4dev:v3   # Tag stable disponible sur Docker Hub
    restart: always
    ports:
      - "5001:80"
      - "2526:25"
      - "1153:143"
      - "1120:110"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev
      - ServerOptions__LockSettings=true
      - ServerOptions__Mailboxes__0=Test=hello@world.com
      - ServerOptions__Database=database.db
      - ServerOptions__NumberOfMessagesToKeep=100
      - ServerOptions__NumberOfSessionsToKeep=50
      - ServerOptions__DisableIPv6=true
      - ServerOptions__TlsMode=None
    networks:
      - backend

# ============================================================
#   VOLUMES PERSISTANTS
# ============================================================
volumes:
  db_data:
  smtp4dev-data:

# ============================================================
#   RÉSEAU INTERNE UNIQUE
# ============================================================
networks:
  backend:
